name: Build Snap

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  build-snap:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Repository
        uses: actions/checkout@v4

      - name: Build snap
        uses: snapcore/action-build@v1
        id: build

      - name: Smoke test (install & launch on real Ubuntu, headless)
        run: |
          sudo snap install --dangerous "${{ steps.build.outputs.snap }}"
          sudo apt-get update && sudo apt-get install -y xvfb
          timeout 10 xvfb-run --auto-servernum riikunlogbrowser > /tmp/run.log 2>&1 || true
          echo "----- 実行ログ -----"
          cat /tmp/run.log
          echo "---------------------"

          if grep -qi "Cannot find libmpv\|symbol lookup error" /tmp/run.log; then
            echo "::error::起動時にエラーが検出されました。上記ログを確認してください"
            exit 1
          else
            echo "エラーは検出されませんでした"
          fi

      - name: Upload snap artifact
        uses: actions/upload-artifact@v4
        with:
          name: riikunlogbrowser-linux-snap
          path: ${{ steps.build.outputs.snap }}

      # タグ付けした時だけSnap Storeへ自動公開したい場合は、
      # 下記のコメントを外し、GitHub Secretsに SNAPCRAFT_STORE_CREDENTIALS を設定してください。
      # 発行方法: snapcraft export-login --snaps=riikunlogbrowser --channels=stable exported.txt
      #
      # - name: Release to the Snap Store
      #   uses: snapcore/action-publish@v1
      #   env:
      #     SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
      #   with:
      #     snap: ${{ steps.build.outputs.snap }}
      #     release: stable
