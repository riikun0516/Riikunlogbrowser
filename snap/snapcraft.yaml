name: riikunlog-browser
title: りーろぐブラウザ
base: core24
version: '2026.09.12'
summary: ブログ・ポッドキャスト・お知らせをひとつに
license: proprietary
contact: customer.center@radiostrike.jp
website: https://www.radiostrike.jp
source-code: https://github.com/riikun0516/riikunlogbrowser
description: |
  「りーろぐブラウザ」は、個人ブログ「りーろぐ」およびポッドキャスト番組
  「RadioStrike」のリスナー・読者向けに、両方のコンテンツを1つのアプリで
  手軽に楽しめるようにするコンパニオンアプリです。

  ・りーろぐ: ブログ記事の一覧・詳細を閲覧
  ・RadioStrike: ポッドキャストのエピソード一覧・再生
  ・Webブラウザ: システムの既定ブラウザでサイトを開く
  ・お知らせ: 運営からのお知らせを閲覧

  ログインやアカウント登録は一切不要です。

grade: stable
confinement: strict

platforms:
  amd64:

apps:
  riikunlog-browser:
    command: riikunlogbrowser
    extensions:
      - gnome
    environment:
      LD_LIBRARY_PATH: $SNAP/usr/lib/x86_64-linux-gnu:$SNAP/usr/lib:${LD_LIBRARY_PATH}
    plugs:
      - network          # りーろぐ/お知らせのAPI取得、ポッドキャスト音声のストリーミング
      - audio-playback    # RadioStrikeの音声再生(media_kit/mpv)
      - desktop           # 既定のWebブラウザを開くために必要(xdg-open相当)
      - desktop-legacy
      - wayland
      - x11

parts:
  riikunlogbrowser:
    source: .
    plugin: flutter
    flutter-target: lib/main.dart
    build-packages:
      - libmpv-dev
      - mpv
    stage-packages:
      - libmpv2
      - libblas3
      - liblapack3
    override-prime: |
      craftctl default
      # media_kitはlibmpv.so.1という名前を決め打ちで探すため、
      # Ubuntu 24.04のlibmpv.so.2向けに互換シンボリックリンクを追加する
      ln -sf libmpv.so.2 "$CRAFT_PRIME/usr/lib/x86_64-linux-gnu/libmpv.so.1"
      ln -sf libmpv.so.2 "$CRAFT_PRIME/usr/lib/x86_64-linux-gnu/libmpv.so"
      # libblas3/liblapack3はupdate-alternativesでシンボリックリンクを作る前提のパッケージだが、
      # Snapcraftのステージングではそれが実行されないため手動で補う
      for lib in blas lapack; do
        real=$(find "$CRAFT_PRIME/usr/lib/x86_64-linux-gnu/$lib" -maxdepth 1 -name "lib${lib}.so.3*" 2>/dev/null | head -n1)
        echo "DEBUG: lib${lib} candidate = $real"
        if [ -n "$real" ]; then
          ln -sf "$lib/$(basename "$real")" "$CRAFT_PRIME/usr/lib/x86_64-linux-gnu/lib${lib}.so.3"
        fi
      done
      ls -la "$CRAFT_PRIME/usr/lib/x86_64-linux-gnu/" | grep -i "blas\|lapack" || echo "DEBUG: no blas/lapack files found at top level"
    prime:
      # gnome拡張機能が既に提供しているため、二重に含めるとバージョン衝突を起こす
      - -usr/lib/*/libglib-2.0*
      - -usr/lib/*/libgobject-2.0*
      - -usr/lib/*/libgio-2.0*
      - -usr/lib/*/libgmodule-2.0*
      - -usr/lib/*/libgtk-3*
      - -usr/lib/*/libgdk-3*
      - -usr/lib/*/libgdk_pixbuf-2.0*
      - -usr/lib/*/gdk-pixbuf-2.0
      - -usr/lib/*/libpango*
      - -usr/lib/*/libcairo*
      - -usr/lib/*/libatk-1.0*
      - -usr/lib/*/libatk-bridge-2.0*
      - -usr/lib/*/libharfbuzz*
      - -usr/lib/*/libfribidi*
      - -usr/lib/*/libfontconfig*
      - -usr/lib/*/libfreetype*
      - -usr/lib/*/libthai*
      - -usr/lib/*/libdatrie*
      - -usr/share/glib-2.0
      - -usr/bin

lint:
  ignore:
    - library:
        - usr/lib/*/libmpv.so*
