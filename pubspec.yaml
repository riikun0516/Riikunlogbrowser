name: riikunlogbrowser
description: riikunlogbrowser

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=2.19.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # 日本語環境（中華フォント対策）に必要
  flutter_localizations:
    sdk: flutter
  # バージョン競合を避けるため明示的に指定
  intl: ^0.20.2

  # HTTPリクエスト用
  http: ^1.1.0

  # RSS/Atomフィードの解析用
  webfeed_plus: ^1.0.2

  # WebView表示用
  webview_flutter: ^4.7.0
  webview_flutter_windows: ^1.2.0
  url_launcher: ^6.3.2

  # 音声再生用（マルチプラットフォーム対応）
  media_kit: ^1.2.6
  media_kit_libs_windows_audio: ^1.0.9
  media_kit_native_event_loop: ^1.0.9
  media_kit_libs_android_audio: ^1.3.8
  media_kit_libs_macos_audio: ^1.1.4
  media_kit_libs_ios_audio: ^1.1.4

  # アイコン表示用
  cupertino_icons: ^1.0.2
  
  # その他
  upgrader: ^11.5.0
  flutter_widget_from_html: ^0.15.3
  flutter_launcher_icons: "^0.13.1"
  audio_video_progress_bar: ^2.0.3
  async: ^2.13.0
  google_fonts: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  msix: ^3.16.12

# バージョン競合を強制的に解決する設定
dependency_overrides:
  intl: 0.20.2

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true

  # フォント設定
  fonts:
    - family: LINESeedJP
      fonts:
        - asset: assets/fonts/LINESeedJP-Regular.ttf
        - asset: assets/fonts/LINESeedJP-Bold.ttf
          weight: 700

msix_config:
  display_name: りーろぐブラウザ
  publisher_display_name: RiikunJapan
  identity_name: RiikunJapan.184236E1C50B2
  publisher: "CN=F5E968CF-9F93-40A3-BFD8-31060FEBE4CE"
  certificate_path: "key.pfx"
  certificate_password: "kkgames0"
  msix_version: 2026.4.7.0
  logo_path: "D:/riikunlogbrowser/logo.png"

flutter_launcher_icons:
  image_path: "logo.png"
  android: true
  ios: true
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: "logo.png"
  windows:
    generate: true
    image_path: "logo.png"
    icon_size: 48